name: Deploy PIL homepage to CST

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_public:
        description: Check public DNS entry after deployment (disable only for initial server staging)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pil-homepage-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out homepage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
      - name: Install pinned tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate homepage assets and packaging
        run: |
          npm test
          npm run test:receiver
          npm run verify
          npm run build
      - name: Publish and verify production deployment
        env:
          CST_HOST: ${{ secrets.CST_HOST }}
          CST_DEPLOY_TOKEN: ${{ secrets.CST_DEPLOY_TOKEN }}
        run: npm run deploy
      - name: Verify public homepage
        if: github.event_name != 'workflow_dispatch' || inputs.verify_public
        run: node scripts/verify-live.mjs
