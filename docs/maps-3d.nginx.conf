# Include inside the EXISTING pkuidv.com HTTPS server {}.
# The release has maps-3d/ directly underneath /srv/pil-maps/current/.
location = /maps-3d {
    return 302 /maps-3d/$is_args$args;
}

location ^~ /maps-3d/ {
    root /srv/pil-maps/current;
    index index.html;
    try_files $uri $uri/ =404;
    autoindex off;

    types {
        text/html html;
        application/javascript js;
        text/css css;
        application/json json;
    }
    default_type application/octet-stream;

    # These files have stable names; revalidate the whole release together.
    expires off;
    open_file_cache off;
    etag on;
    add_header Cache-Control "no-cache" always;
    # This must be the only CSP applied to map responses.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json;
}
